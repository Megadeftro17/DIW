<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikes-LE | Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="alternate stylesheet" href="css/alternativo.css" title="Modo Oscuro">
</head>
<body>

    <header>
        <h1>Bikes-LE</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="centrado">Ponte en Contacto</h2>

        <form action="#" method="post">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <!-- Ejemplo de mensaje de error visual para la clase solicitada -->
            <p class="error-formulario">Por favor, introduce un correo válido.</p>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

            <button type="submit" class="boton-compra">Enviar Mensaje</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Bikes-LE. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
